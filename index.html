    *{box-sizing:border-box} body{margin:0;font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);font-size:var(--text-base)} button,input,select,textarea{font:inherit} .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh} .sidebar{padding:var(--space-6);border-right:1px solid var(--color-border);background:linear-gradient(180deg,#111,#0d0d0d);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto} .brand{display:flex;gap:var(--space-3);align-items:center;margin-bottom:var(--space-8)} .logo{width:46px;height:46px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--color-primary),var(--color-primary) 6px,#111 6px,#111 12px)} .brand h1{margin:0;font-family:var(--font-display);font-size:var(--text-lg)} .brand p{margin:0;color:var(--color-faint);font-size:var(--text-xs)} .nav{display:grid;gap:var(--space-2)} .nav button{display:flex;gap:var(--space-3);align-items:center;width:100%;padding:.9rem 1rem;border-radius:var(--radius-lg);border:1px solid transparent;background:transparent;color:var(--color-muted);cursor:pointer;text-align:left} .nav button.active,.nav button:hover{background:var(--color-primary-soft);border-color:rgba(255,107,0,.2);color:#fff} .topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);background:rgba(13,13,13,.9);backdrop-filter:blur(8px)} .topbar h2{margin:0;font-family:var(--font-display);font-size:var(--text-xl)} .content{padding:var(--space-6);display:grid;gap:var(--space-6)} .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-5)} .grid{display:grid;gap:var(--space-4)} .stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))} .section-title{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)} .section-title h3{margin:0;font-family:var(--font-display);font-size:var(--text-lg)} .toolbar,.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap} .btn,.file-label{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-radius:var(--radius-md);background:var(--color-primary);color:#fff;border:none;cursor:pointer;text-decoration:none} .btn:hover,.file-label:hover{background:var(--color-primary-hover)} .btn.secondary{background:var(--color-surface-2);border:1px solid var(--color-border)} .btn.secondary:hover,.btn.ghost:hover{background:var(--color-surface-3)} .btn.ghost{background:transparent;border:1px solid var(--color-border);color:var(--color-muted)} .hidden{display:none!important} .faint{color:var(--color-faint)} .small{font-size:var(--text-sm)} .stat-value{font-family:var(--font-display);font-size:var(--text-xl)} .table-wrap{overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-lg)} table{width:100%;border-collapse:collapse;min-width:880px} th,td{padding:.8rem .9rem;border-bottom:1px solid var(--color-border);text-align:left;vertical-align:top} th{background:var(--color-surface-2);color:var(--color-muted);font-size:var(--text-sm)} .badge{display:inline-flex;gap:.35rem;align-items:center;padding:.25rem .6rem;border-radius:var(--radius-full);font-size:var(--text-xs);border:1px solid transparent} .badge.ok{background:rgba(76,175,80,.12);color:#9de0a1;border-color:rgba(76,175,80,.25)} .badge.warn{background:rgba(255,176,32,.12);color:#ffd58f;border-color:rgba(255,176,32,.25)} .badge.err{background:rgba(255,110,110,.12);color:#ffb0b0;border-color:rgba(255,110,110,.25)} .badge.neutral{background:rgba(255,255,255,.06);color:var(--color-muted);border-color:rgba(255,255,255,.08)} input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:.8rem .85rem;background:#101010;border:1px solid var(--color-border);border-radius:var(--radius-md);color:#fff} textarea{min-height:88px} .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4)} .panel-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--space-4)} .assignment-list{display:grid;gap:var(--space-3)} .assignment-role{display:grid;grid-template-columns:170px 1fr auto;gap:var(--space-3);align-items:center;padding:.9rem;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface-2)} .match-card{display:grid;gap:var(--space-2);padding:var(--space-4);border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface-2)} .progress{height:10px;border-radius:999px;background:#222;overflow:hidden} .progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),#ffa25a)} .toast-wrap{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:30} .toast{min-width:260px;padding:.9rem 1rem;border-left:4px solid var(--color-primary);border-radius:var(--radius-md);background:#111;border:1px solid var(--color-border)} dialog{border:none;padding:0;background:transparent;max-width:min(920px,96vw)} dialog::backdrop{background:rgba(0,0,0,.6)} .modal{background:var(--color-surface);border:1px solid var(--color-border);border-radius:20px;padding:var(--space-5)} .modal h3{margin:0 0 var(--space-4);font-family:var(--font-display)} .pill{padding:.35rem .65rem;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);display:inline-flex;align-items:center;gap:.35rem} .week-tabs{display:flex;gap:.5rem;flex-wrap:wrap} .week-tab{padding:.45rem .75rem;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);cursor:pointer} .week-tab.active{background:var(--color-primary-soft);border-color:rgba(255,107,0,.3)}
    .hist-row{display:grid;grid-template-columns:150px 1fr 60px;gap:.75rem;align-items:center} .hist-track{background:#101010;border:1px solid var(--color-border);border-radius:999px;overflow:hidden;height:18px} .hist-bar{display:flex;height:100%;min-width:3px;border-radius:999px;overflow:hidden} .hist-ref{background:var(--color-primary)} .hist-jury{background:#d8d8d8} .hist-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hist-val{text-align:right} .legend{display:inline-flex;align-items:center;gap:.4rem;margin-right:1rem} .legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block} .sort-btn{padding:.4rem .7rem;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);color:var(--color-muted);cursor:pointer;font-size:var(--text-sm)} .sort-btn.active{background:var(--color-primary-soft);border-color:rgba(255,107,0,.3);color:#fff}
    .day-header{display:flex;align-items:center;gap:.6rem;margin:var(--space-3) 0 0;font-family:var(--font-display);font-size:var(--text-base);color:var(--color-muted);text-transform:capitalize} .day-header::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--color-primary)} .match-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);cursor:pointer;flex-wrap:wrap} .match-head .chev{transition:transform .15s} .match-head.open .chev{transform:rotate(90deg)} .assignment-role.compact{display:grid;grid-template-columns:1fr auto;gap:.5rem .75rem;align-items:center;padding:.55rem .7rem} .assignment-role.compact .role-label{grid-column:1/-1;display:flex;align-items:baseline;gap:.5rem} .assignment-role.compact .role-label strong{font-size:var(--text-sm)} .lic-select{max-width:160px;padding:.3rem .5rem;font-size:var(--text-xs);margin-left:auto} .date-field{display:inline-flex;align-items:center;gap:.25rem} .date-field input[type=text]{width:120px} .date-field input[type=date]{width:42px;padding:.55rem .4rem;color:transparent} .date-field input[type=date]::-webkit-datetime-edit{display:none} .date-field input[type=date]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer;filter:invert(1)} .indeling-table{min-width:1120px} .indeling-table td{vertical-align:top} .cell-stack{display:flex;flex-direction:column;gap:.25rem;min-width:150px} .cell-lic{padding:.25rem .4rem;font-size:var(--text-xs);max-width:150px;color:var(--color-faint)} .cell-assign-wrap{display:flex;align-items:center;gap:.3rem} .cell-assign{padding:.4rem .5rem;font-size:var(--text-xs)} .warnmark{color:var(--color-warning);cursor:help} .mini-btn{display:inline-flex;align-items:center;gap:.25rem;padding:.4rem .5rem;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface-2);color:var(--color-muted);cursor:pointer;font-size:var(--text-xs);margin:0 1px} .mini-btn:hover{background:var(--color-surface-3)} .mini-btn.danger{border-color:rgba(255,110,110,.4);color:#ffb0b0} .nowrap{white-space:nowrap} .sum{color:var(--color-muted);margin-top:var(--space-2)} .btn.danger,.sort-btn.danger{background:transparent;border:1px solid rgba(255,110,110,.4);color:#ffb0b0} .btn.danger:hover{background:rgba(255,110,110,.12)}
    @media(max-width:1024px){.app{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--color-border);position:static;height:auto;overflow:visible}.panel-grid{grid-template-columns:1fr}} @media(max-width:760px){.topbar{flex-direction:column;align-items:flex-start}.assignment-role{grid-template-columns:1fr}.assignment-role.compact{grid-template-columns:1fr}.hist-row{grid-template-columns:100px 1fr 50px}}

<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="logo"></div><div><h1>Basketbal Indeling</h1><p>Versie 4</p></div></div><nav id="nav" class="nav"></nav></aside>
  <main>
    <div class="topbar"><div><div class="faint small">Werkende app</div><h2 id="pageTitle">Dashboard</h2></div></div>
    <div id="view" class="content"></div>
  </main>
</div>
<div id="toasts" class="toast-wrap"></div>
<dialog id="matchDialog"></dialog>
<dialog id="playerDialog"></dialog>
<dialog id="mappingDialog"></dialog>
<script>
const KEYS={wedstrijden:'bball_wedstrijden',spelers:'bball_spelers',indeling:'bball_indeling',instellingen:'bball_instellingen',tellingen:'bball_tellingen_huidig',archief:'bball_tellingen_archief',mappings:'bball_mappings'};
const tabs=[['dashboard','Dashboard','layout-dashboard'],['wedstrijden','Wedstrijden','calendar-days'],['spelers','Spelers','users'],['indeling','Indeling','clipboard-list'],['geschiedenis','Geschiedenis','history'],['instellingen','Instellingen','settings']];
const app={tab:'dashboard',weekOffset:0,selectedMatchId:null,pendingImport:null,historySort:'total',pdfTeam:'',playerFilter:'',openMatches:{},rangeFrom:null,rangeTo:null,data:loadAll()};
(function(){const s=weekStart(0),e=new Date(s);e.setDate(e.getDate()+6);app.rangeFrom=isoLocal(s);app.rangeTo=isoLocal(e)})();
function uid(){return Math.random().toString(36).slice(2,10)}
function defaults(){return{wedstrijden:[],spelers:[],indeling:{},instellingen:{vereniging:'Mijn Basketbalvereniging',seizoen:'2025-2026'},tellingen:{},archief:{},mappings:{wedstrijden:{date:'datum',time:'tijd',homeTeam:'thuisteam',awayTeam:'tegenstander'},spelers:{name:'naam',team:'team',role:'rol',license:'licentie'}}}}
function loadAll(){const d=defaults(),x={};Object.entries(KEYS).forEach(([k,v])=>{try{x[k]=JSON.parse(localStorage.getItem(v))}catch{x[k]=null}});return{wedstrijden:x.wedstrijden||d.wedstrijden,spelers:x.spelers||d.spelers,indeling:x.indeling||d.indeling,instellingen:x.instellingen||d.instellingen,tellingen:x.tellingen||d.tellingen,archief:x.archief||d.archief,mappings:x.mappings||d.mappings}}
function saveAll(){Object.entries(KEYS).forEach(([k,v])=>localStorage.setItem(v,JSON.stringify(app.data[k])))}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;toasts.appendChild(el);setTimeout(()=>el.remove(),2800)}
function esc(s=''){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function fmtDate(d){const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('nl-NL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}
function weekStart(offset=0){const n=new Date();const day=(n.getDay()+6)%7;n.setDate(n.getDate()-day+offset*7);n.setHours(0,0,0,0);return n}
function inWeek(dateStr,offset){const d=new Date(dateStr+'T00:00:00');const s=weekStart(offset),e=new Date(s);e.setDate(e.getDate()+7);return d>=s&&d<e}
function weekOffsetFor(dateStr){const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return 0;const base=weekStart(0);return Math.round((d-base)/(7*24*60*60*1000))}
function dayLabel(dateStr){const x=new Date(dateStr+'T00:00:00');return isNaN(x)?dateStr:x.toLocaleDateString('nl-NL',{weekday:'long',day:'2-digit',month:'long'})}
function matchOpen(m){return app.openMatches[m.id]!==undefined?app.openMatches[m.id]:statusFor(m)[1]!=='ok'}
function mondayOf(dateStr){const d=new Date(dateStr+'T00:00:00');const s=new Date(d);s.setDate(s.getDate()-((d.getDay()+6)%7));return isoLocal(s)}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function nlDate(iso){if(!iso)return'';const p=String(iso).split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:iso}
function parseDateInput(str){str=String(str||'').trim();if(!str)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(str))return str;const m=str.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){let d=m[1],mo=m[2],y=m[3];if(y.length===2)y='20'+y;const iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return isNaN(new Date(iso+'T00:00:00'))?null:iso}return null}
function rangeBounds(){let from=app.rangeFrom,to=app.rangeTo;if(!from||!to){const s=weekStart(0),e=new Date(s);e.setDate(e.getDate()+6);from=from||isoLocal(s);to=to||isoLocal(e)}return{from,to}}
function inRange(dateStr){const {from,to}=rangeBounds();return dateStr>=from&&dateStr<=to}
function matchesInRange(){return app.data.wedstrijden.filter(w=>inRange(w.date)).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time))}
function applyPreset(p){const s=weekStart(0);if(p==='week'){const e=new Date(s);e.setDate(e.getDate()+6);app.rangeFrom=isoLocal(s);app.rangeTo=isoLocal(e)}else if(p==='2w'){const e=new Date(s);e.setDate(e.getDate()+13);app.rangeFrom=isoLocal(s);app.rangeTo=isoLocal(e)}else if(p==='4w'){const e=new Date(s);e.setDate(e.getDate()+27);app.rangeFrom=isoLocal(s);app.rangeTo=isoLocal(e)}else if(p==='all'){const ds=app.data.wedstrijden.map(w=>w.date).filter(Boolean).sort();if(ds.length){app.rangeFrom=ds[0];app.rangeTo=ds[ds.length-1]}}render()}
function licRank(l){return l==='BS3'?3:l==='BS2'?2:0}
function mapLicense(raw){const v=String(raw||'').toLowerCase().replace(/\s+/g,' ').trim();if(!v)return'';if(v==='bs3')return'BS3';if(v==='bs2')return'BS2';const bs3=['basketbalscheidsrechter 4 in opleiding','basketbalscheidsrechter 3 in opleiding','basketbalscheidsrechter 3','scheidsrechter e-diploma'];const bs2=['basketbalscheidsrechter 2','scheidsrechter f-diploma'];if(bs3.includes(v))return'BS3';if(bs2.includes(v))return'BS2';return''}
function licenseMeets(playerLic,req){return licRank(playerLic)>=licRank(req)}
function refLicReq(match,roleKey){return (match.refLic&&match.refLic[roleKey])||''}
function dayTimes(date){return [...new Set(app.data.wedstrijden.filter(w=>w.date===date).map(w=>w.time))].sort()}
function teamPlaysAdjacent(team,match){if(!team)return false;const times=dayTimes(match.date);const idx=times.indexOf(match.time);const adj=[times[idx-1],times[idx+1]].filter(Boolean);if(!adj.length)return false;return app.data.wedstrijden.some(w=>w.date===match.date&&w.homeTeam===team&&adj.includes(w.time))}
function rolesFor(match){const roles=[{key:'scheidsrechter1',label:'Scheidsrechter 1',type:'scheidsrechter'},{key:'scheidsrechter2',label:'Scheidsrechter 2',type:'scheidsrechter'},{key:'jury1',label:'Timer',type:'jury'},{key:'jury2',label:'Scorer',type:'jury'}];if(match.extra24)roles.push({key:'jury3',label:'24-seconde operator',type:'jury'});return roles}
function assignmentFor(id){return app.data.indeling[id]||{}}
function statusFor(match){const roles=rolesFor(match),asg=assignmentFor(match.id),filled=roles.filter(r=>asg[r.key]).length;if(!filled)return['Niet ingedeeld','neutral'];if(filled===roles.length)return['Volledig','ok'];return[filled+'/'+roles.length+' ingevuld','warn']}
function player(id){return app.data.spelers.find(p=>p.id===id)}
function fullName(p){if(!p)return 'Onbekend';const parts=[p.voornaam,p.tussenvoegsel,p.achternaam].map(x=>String(x||'').trim()).filter(Boolean);return parts.length?parts.join(' '):(p.name||'Onbekend')}
function splitName(full){full=String(full||'').trim().replace(/\s+/g,' ');if(!full)return{voornaam:'',tussenvoegsel:'',achternaam:''};const parts=full.split(' ');if(parts.length===1)return{voornaam:parts[0],tussenvoegsel:'',achternaam:''};const tuss=['de','van','der','den','ten','ter','het','op',"'t"];const voornaam=parts.shift();const tv=[];while(parts.length>1&&tuss.includes(parts[0].toLowerCase())){tv.push(parts.shift())}return{voornaam,tussenvoegsel:tv.join(' '),achternaam:parts.join(' ')}}
function playerName(id){return fullName(player(id))}
function availabilityInfo(p){return p.status==='available'?['Beschikbaar','ok']:p.status==='inactive'?['Inactief','neutral']:['Niet beschikbaar','warn']}
function teamList(){return [...new Set(app.data.wedstrijden.map(w=>w.homeTeam).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function updateCounts(){const counts={};app.data.wedstrijden.forEach(w=>{rolesFor(w).forEach(role=>{const pid=assignmentFor(w.id)[role.key];if(!pid)return;counts[pid]??={scheidsrechter:0,jury:0};counts[pid][role.type]++})});app.data.tellingen=counts}
function hardConflict(pid,match,tempIndeling){
  const indeling=tempIndeling||app.data.indeling;
  return app.data.wedstrijden.some(w=>{
    if(w.id===match.id)return false;
    if(w.date!==match.date||w.time!==match.time)return false;
    const asg=indeling[w.id]||{};
    return Object.values(asg).filter(Boolean).includes(pid);
  });
}
function sameDayElsewhere(pid,match,tempIndeling){
  const indeling=tempIndeling||app.data.indeling;
  return app.data.wedstrijden.some(w=>{
    if(w.id===match.id)return false;
    if(w.date!==match.date)return false;
    if(w.time===match.time)return false;
    const asg=indeling[w.id]||{};
    return Object.values(asg).filter(Boolean).includes(pid);
  });
}
function rankedCandidates(match,role,tempAsg,tempIndeling,tempCounts){
  const currentAsg=tempAsg||assignmentFor(match.id);
  const usedInMatch=Object.values(currentAsg).filter(Boolean);
  const reqLic=role.type==='scheidsrechter'?refLicReq(match,role.key):'';
  // teams die al aan een juryrol van deze wedstrijd zijn toegewezen (voor groepering)
  const juryTeamsUsed=role.type==='jury'?rolesFor(match).filter(r=>r.type==='jury').map(r=>currentAsg[r.key]).filter(Boolean).map(pid=>player(pid)&&player(pid).team).filter(Boolean):[];
  return app.data.spelers
    .filter(p=>p.status==='available')
    .filter(p=>!usedInMatch.includes(p.id))
    .filter(p=>!hardConflict(p.id,match,tempIndeling))
    .map(p=>{
      let score=0;const reasons=[];
      if(p.team===match.homeTeam){score+=100;reasons.push('Eigen team speelt nu')}
      if(reqLic&&!licenseMeets(p.license,reqLic)){score+=90;reasons.push('Mist licentie '+reqLic)}
      if(role.type==='jury'&&p.team!==match.homeTeam){
        if(teamPlaysAdjacent(p.team,match)){
          score-=60; // voorkeur: team speelt vlak voor/na
          if(juryTeamsUsed.length&&juryTeamsUsed.includes(p.team))score-=40; // zelfde team als andere juryleden
        }else{
          score+=80;reasons.push('Team speelt niet vlak voor/na');
        }
      }

 spelers(){const f=(app.playerFilter||'').toLowerCase();const list=app.data.spelers.filter(p=>!f||[fullName(p),p.team,p.role,p.license].some(v=>String(v||'').toLowerCase().includes(f)));return `<section class="card"><div class="section-title"><h3>Spelers</h3><div class="toolbar"><label class="file-label"><input id="spelersFile" type="file" accept=".xlsx,.xls,.csv" class="hidden">Spelers uploaden</label><label class="file-label secondary" style="background:var(--color-surface-2);border:1px solid var(--color-border)"><input id="licentieFile" type="file" accept=".xlsx,.xls,.csv" class="hidden"><i data-lucide="award"></i>Licenties uploaden</label><button class="btn secondary" id="openPlayerForm">Speler toevoegen</button><button class="btn danger" id="deleteAllPlayersBtn"><i data-lucide="trash-2"></i>Alle spelers verwijderen</button></div></div><div class="toolbar"><input type="search" id="playerSearch" placeholder="Zoek op naam, team of licentie…" value="${esc(app.playerFilter)}" style="max-width:340px"><span class="small faint">${list.length} van ${app.data.spelers.length} spelers</span></div><p class="small faint">Licenties uploaden: kies een Excel met een naam- en licentiekolom. De licenties (BS2/BS3) worden automatisch gekoppeld aan bestaande spelers op basis van de naam.</p></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Naam</th><th>Team</th><th>Rol</th><th>Licentie</th><th>Status</th><th>Reden</th><th>Acties</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(fullName(p))}</td><td>${esc(p.team||'')}</td><td>${esc(p.role||'')}</td><td>${esc(p.license||'—')}</td><td><select data-player-status="${p.id}"><option value="available" ${p.status==='available'?'selected':''}>Beschikbaar</option><option value="unavailable" ${p.status==='unavailable'?'selected':''}>Niet beschikbaar</option><option value="inactive" ${p.status==='inactive'?'selected':''}>Inactief</option></select></td><td><input type="text" data-player-reason="${p.id}" value="${e  indeling(){

 document.querySelectorAll('[data-pdf-match]').forEach(b=>b.onclick=()=>exportPdf(b.dataset.pdfMatch));
 document.querySelectorAll('[data-copy-match]').forEach(b=>b.onclick=()=>{const m=app.data.wedstrijden.find(w=>w.id===b.dataset.copyMatch);navigator.clipboard.writeText(copyText([m])).then(()=>toast('Wedstrijd gekopieerd'))});
 const _bulkBtn=document.getElementById('bulkWeekBtn');if(_bulkBtn)_bulkBtn.onclick=()=>autoAssignWeek(app.weekOffset);
 const _rf=document.getElementById('rangeFrom');const _rt=document.getElementById('rangeTo');const _rfT=document.getElementById('rangeFromText');const _rtT=document.getElementById('rangeToText');
 if(_rf)_rf.onchange=()=>{if(_rf.value){app.rangeFrom=_rf.value}render()};
 if(_rt)_rt.onchange=()=>{if(_rt.value){app.rangeTo=_rt.value}render()};
 if(_rfT)_rfT.onchange=()=>{const iso=parseDateInput(_rfT.value);if(iso===null){toast('Ongeldige datum — gebruik dd-mm-jjjj');render();return}if(iso)app.rangeFrom=iso;render()};
 if(_rtT)_rtT.onchange=()=>{const iso=parseDateInput(_rtT.value);if(iso===null){toast('Ongeldige datum — gebruik dd-mm-jjjj');render();return}if(iso)app.rangeTo=iso;render()};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));
 const _bulkRange=document.getElementById('bulkRangeBtn');if(_bulkRange)_bulkRange.onclick=autoAssignRange;
 const _copyRange=document.getElementById('copyRangeBtn');if(_copyRange)_copyRange.onclick=()=>navigator.clipboard.writeText(copyText(matchesInRange())).then(()=>toast('Periode gekopieerd'));
 const _clearRange=document.getElementById('clearRangeBtn');if(_clearRange)_clearRange.onclick=clearRangeAssignment;
 const _cwBtn=document.getElementById('copyWeekBtn');if(_cwBtn)_cwBtn.onclick=()=>navigator.clipboard.writeText(copyText(app.data.wedstrijden.filter(w=>inWeek(w.date,app.weekOffset)).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time)))).then(()=>toast('Week gekopieerd'));
 const _pts=document.getElementById('pdfTeamSelect');if(_pts)_pts.onchange=()=>{app.pdfTeam=_pts.value};
 const _ptb=document.getElementById('pdfTeamBtn');if(_ptb)_ptb.onclick=()=>exportTeamPdf(app.pdfTeam);
 const _ics=document.getElementById('icsBtn');if(_ics)_ics.onclick=exportICS;
 document.querySelectorAll('[data-hist-sort]').forEach(b=>b.onclick=()=>{app.historySort=b.dataset.histSort;render()});
 const _ehBtn=document.getElementById('exportHistoryBtn');if(_ehBtn)_ehBtn.onclick=exportHistory;
 const _archBtn=document.getElementById('archiveBtn');if(_archBtn)_archBtn.onclick=archiveSeason;
 const _viInput=document.getElementById('verenigingInput');if(_viInput)_viInput.onchange=()=>{app.data.instellingen.vereniging=_viInput.value;saveAll();toast('Instellingen opgeslagen')};
 const _siInput=document.getElementById('seizoenInput');if(_siInput)_siInput.onchange=()=>{app.data.instellingen.seizoen=_siInput.value;saveAll();toast('Instellingen opgeslagen')};
 document.querySelectorAll('[data-toggle24-match]').forEach(b=>b.onclick=()=>toggle24(b.dataset.toggle24Match));

}
function openMatchDialog(id){const m=app.data.wedstrijden.find(x=>x.id===id)||{id:null,date:'',time:'19:00',homeTeam:'',awayTeam:''};matchDialog.innerHTML=`<form method="dialog" class="modal"><h3>${id?'Wedstrijd bewerken':'Wedstrijd toevoegen'}</h3><div class="form-grid"><div><label class="small faint">Datum</label><input id="mdDate" type="date" value="${esc(m.date)}"></div><div><label class="small faint">Tijd</label><input id="mdTime" type="time" value="${esc(m.time)}"></div><div><label class="small faint">Thuisteam</label><input id="mdHome" type="text" value="${esc(m.homeTeam)}"></div><div><label class="small faint">Tegenstander</label><input id="mdAway" type="text" value="${esc(m.awayTeam)}"></div></div><div class="toolbar" style="margin-top:1rem"><button class="btn" id="saveMatchDialogBtn" type="button">Opslaan</button><button class="btn ghost" type="submit">Sluiten</button></div></form>`;matchDialog.showModal();document.getElementById('saveMatchDialogBtn').onclick=()=>{const obj={id:m.id||uid(),date:mdDate.value,time:mdTime.value,homeTeam:mdHome.value.trim(),awayTeam:mdAway.value.trim()};if(!obj.date||!obj.homeTeam)return alert('Datum en thuisteam zijn verplicht');if(m.id){const idx=app.data.wedstrijden.findIndex(x=>x.id===m.id);app.data.wedstrijden[idx]=obj}else app.data.wedstrijden.push(obj);saveAll();matchDialog.close();render();toast('Wedstrijd opgeslagen')}}
function deleteMatch(id){const m=app.data.wedstrijden.find(x=>x.id===id);if(!m)return;if(!confirm(`Wedstrijd ${m.homeTeam} vs ${m.awayTeam} verwijderen?`))return;app.data.wedstrijden=app.data.wedstrijden.filter(x=>x.id!==id);delete app.data.indeling[id];updateCounts();saveAll();render();toast('Wedstrijd verwijderd')}
function deleteAllMatches(){if(!app.data.wedstrijden.length)return toast('Er zijn geen wedstrijden');if(!confirm(`Alle ${app.data.wedstrijden.length} wedstrijden verwijderen? Ook de bijbehorende indelingen worden gewist. Spelers blijven staan.`))return;app.data.wedstrijden=[];app.data.indeling={};app.selectedMatchId=null;updateCounts();saveAll();render();toast('Alle wedstrijden verwijderd')}
function deleteAllPlayers(){if(!app.data.spelers.length)return toast('Er zijn geen spelers');if(!confirm(`Alle ${app.data.spelers.length} spelers verwijderen? Bestaande indelingen worden hierbij gewist. Wedstrijden blijven staan.`))return;app.data.spelers=[];app.data.indeling={};updateCounts();saveAll();render();toast('Alle spelers verwijderd')}
function openPlayerDialog(id){const p=app.data.spelers.find(x=>x.id===id)||{id:null,voornaam:'',tussenvoegsel:'',achternaam:'',team:'',role:'beide',license:'',status:'available',reason:''};playerDialog.innerHTML=`<form method="dialog" class="modal"><h3>${id?'Speler bewerken':'Speler toevoegen'}</h3><div class="form-grid"><div><label class="small faint">Voornaam</label><input id="pdVoornaam" type="text" value="${esc(p.voornaam||'')}"></div><div><label class="small faint">Tussenvoegsel</label><input id="pdTussen" type="text" value="${esc(p.tussenvoegsel||'')}" placeholder="bv. van der"></div><div><label class="small faint">Achternaam</label><input id="pdAchternaam" type="text" value="${esc(p.achternaam||'')}"></div><div><label class="small faint">Team</label><input id="pdTeam" type="text" value="${esc(p.team)}"></div><div><label class="small faint">Rol</label><select id="pdRole"><option ${p.role==='scheidsrechter'?'selected':''}>scheidsrechter</option><option ${p.role==='jury'?'selected':''}>jury</option><option ${p.role==='beide'?'selected':''}>beide</option></select></div><div><label class="small faint">Licentie</label><select id="pdLicense"><option value="" ${!p.license?'selected':''}>Geen</option><option value="BS2" ${p.license==='BS2'?'selected':''}>BS2</option><option value="BS3" ${p.license==='BS3'?'selected':''}>BS3</option></select></div><div><label class="small faint">Status</label><select id="pdStatus"><option value="available" ${p.status==='available'?'selected':''}>Beschikbaar</option><option value="unavailable" ${p.status==='unavailable'?'selected':''}>Niet beschikbaar</option><option value="inactive" ${p.status==='inactive'?'selected':''}>Inactief</option></select></div><div style="grid-column:1/-1"><label class="small faint">Reden</label><input id="pdReason" type="text" value="${esc(p.reason)}"></div></div><div class="toolbar" style="margin-top:1rem"><button class="btn" id="savePlayerDialogBtn" type="button">Opslaan</button><button class="btn ghost" type="submit">Sluiten</button></div></form>`;playerDialog.showModal();document.getElementById('savePlayerDialogBtn').onclick=()=>{const obj={id:p.id||uid(),voornaam:pdVoornaam.value.trim(),tussenvoegsel:pdTussen.value.trim(),achternaam:pdAchternaam.value.trim(),team:pdTeam.value.trim(),role:pdRole.value,license:pdLicense.value,status:pdStatus.value,reason:pdReason.value.trim()};if(!obj.voornaam&&!obj.achternaam)return alert('Vul minimaal een voornaam of achternaam in');obj.name=fullName(obj);if(p.id){const idx=app.data.spelers.findIndex(x=>x.id===p.id);app.data.spelers[idx]=obj}else app.data.spelers.push(obj);saveAll();playerDialog.close();render();toast('Speler opgeslagen')}}
function deletePlayer(id){const p=player(id);if(!p)return;if(!confirm(`${p.name} verwijderen? Bestaande indelingen met deze speler worden gewist.`))return;Object.keys(app.data.indeling).forEach(mid=>{const asg=app.data.indeling[mid];Object.keys(asg).forEach(k=>{if(asg[k]===id)delete asg[k]})});app.data.spelers=app.data.spelers.filter(x=>x.id!==id);updateCounts();saveAll();render();toast('Speler verwijderd')}
function splitCSV(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function changePlayerStatus(id,status){const p=player(id);if(!p)return;const today=new Date();today.setHours(0,0,0,0);const futureConflicts=[];if(status!=='available'){app.data.wedstrijden.forEach(w=>{const d=new Date(w.date+'T00:00:00');if(d<today)return;const assigned=Object.values(assignmentFor(w.id)).includes(id);if(assigned)futureConflicts.push(w)})}if(futureConflicts.length){const remove=confirm(`${p.name} staat nog ingepland voor ${futureConflicts.length} toekomstige wedstrijd(en). OK = toekomstige indelingen verwijderen, Annuleren = alleen conflictwaarschuwing tonen.`);if(remove){futureConflicts.forEach(w=>{const asg=assignmentFor(w.id);Object.keys(asg).forEach(k=>{if(asg[k]===id)delete asg[k]});app.data.indeling[w.id]=asg})}}p.status=status;updateCounts();saveAll();render();toast('Beschikbaarheidsstatus aangepast')}
function assignRole(matchId,roleKey,playerId){const asg={...assignmentFor(matchId)};if(playerId)asg[roleKey]=playerId;else delete asg[roleKey];app.data.indeling[matchId]=asg;updateCounts();saveAll();render()}
function toggle24(matchId){const m=app.data.wedstrijden.find(w=>w.id===matchId);if(!m)return;m.extra24=!m.extra24;if(!m.extra24){const asg=app.data.indeling[matchId];if(asg)delete asg.jury3}updateCounts();saveAll();render();toast(m.extra24?'24-seconde operator toegevoegd':'24-seconde operator verwijderd')}
function setRefLic(matchId,roleKey,val){const m=app.data.wedstrijden.find(w=>w.id===matchId);if(!m)return;m.refLic=m.refLic||{};if(val)m.refLic[roleKey]=val;else delete m.refLic[roleKey];saveAll();render();toast(val?('Licentie-eis '+val+' ingesteld'):'Licentie-eis verwijderd')}
function clearMatchAssignment(id){const m=app.data.wedstrijden.find(w=>w.id===id);if(!m)return;if(!confirm(`Indeling van ${m.homeTeam} vs ${m.awayTeam} volledig wissen?`))return;delete app.data.indeling[id];updateCounts();saveAll();render();toast('Wedstrijdindeling gewist')}
function clearWeekAssignment(offset){const wk=app.data.wedstrijden.filter(w=>inWeek(w.date,offset));if(!wk.length)return toast('Geen wedstrijden in deze week');if(!confirm(`Indeling van alle ${wk.length} wedstrijd(en) in deze week wissen?`))return;wk.forEach(w=>delete app.data.indeling[w.id]);updateCounts();saveAll();render();toast('Weekindeling gewist')}
function clearRangeAssignment(){const ms=matchesInRange();if(!ms.length)return toast('Geen wedstrijden in deze periode');if(!confirm(`Indeling van alle ${ms.length} wedstrijd(en) in deze periode wissen?`))return;ms.forEach(w=>delete app.data.indeling[w.id]);updateCounts();saveAll();render();toast('Periode-indeling gewist')}
function clearAllAssignment(){if(!confirm('Let op: de VOLLEDIGE indeling van het hele seizoen wordt gewist. Wedstrijden, spelers en profielen blijven staan. Doorgaan?'))return;app.data.indeling={};updateCounts();saveAll();render();toast('Hele indeling gewist')}
function normalizeDate(v){if(!v)return'';if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const p=s.split(/[-/]/);if(p.length===3){if(p[0].length===4)return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}return''}
function normalizeTime(v){if(!v)return'';if(typeof v==='number'){const total=Math.round(v*24*60);return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}const s=String(v).trim();return s.slice(0,5)}
function importSheet(file,type){if(!file)return;const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:''});if(!rows.length)return toast('Bestand is leeg');openMappingDialog(type,rows)};r.readAsArrayBuffer(file)}
function openMappingDialog(type,rows){const headers=Object.keys(rows[0]||{});const map=app.data.mappings[type]||{};const fields=type==='wedstrijden'?[['date','Datum'],['time','Tijd'],['homeTeam','Thuisteam'],['awayTeam','Tegenstander']]:type==='licenties'?[['name','Naam (volledige naam)'],['license','Licentie (BS2/BS3)']]:[['voornaam','Voornaam'],['tussenvoegsel','Tussenvoegsel'],['achternaam','Achternaam'],['name','Volledige naam (optioneel)'],['team','Team'],['role','Rol'],['license','Licentie']];const titel=type==='licenties'?'Licenties koppelen':('Kolomkoppeling '+type);const hint=type==='spelers'?'<p class="small faint" style="margin-top:.5rem">Koppel los Voornaam, Tussenvoegsel en Achternaam. Heb je alleen één naamkolom, koppel die dan aan "Volledige naam"; de app splitst hem dan automatisch. In de app verschijnt altijd de samengevoegde volledige naam.</p>':'';mappingDialog.innerHTML=`<form method="dialog" class="modal"><h3>${titel}</h3><div class="form-grid">${fields.map(([key,label])=>`<div><label class="small faint">${label}</label><select data-map-field="${key}"><option value="">-- kies kolom --</option>${headers.map(h=>`<option value="${esc(h)}" ${String(map[key]||'').toLowerCase()===String(h).toLowerCase()?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>${hint}<div class="toolbar" style="margin-top:1rem"><button class="btn" id="applyMappingBtn" type="button">${type==='licenties'?'Koppelen':'Importeren'}</button><button class="btn ghost" type="submit">Annuleren</button></div></form>`;mappingDialog.showModal();document.getElementById('applyMappingBtn').onclick=()=>{const mapping={};mappingDialog.querySelectorAll('[data-map-field]').forEach(s=>mapping[s.dataset.mapField]=s.value);app.data.mappings[type]=mapping;applyImport(type,rows,mapping);saveAll();mappingDialog.close();render()}}
function applyImport(type,rows,mapping){if(type==='wedstrijden'){let overwrites=0,added=0;rows.forEach(r=>{const obj={id:uid(),date:normalizeDate(r[mapping.date]),time:normalizeTime(r[mapping.time]),homeTeam:String(r[mapping.homeTeam]||'').trim(),awayTeam:String(r[mapping.awayTeam]||'').trim()};if(!obj.date||!obj.homeTeam)return;const idx=app.data.wedstrijden.findIndex(w=>w.date===obj.date&&w.time===obj.time&&w.homeTeam===obj.homeTeam);if(idx>=0){overwrites++;app.data.wedstrijden[idx]={...app.data.wedstrijden[idx],...obj,id:app.data.wedstrijden[idx].id}}else{app.data.wedstrijden.push(obj);added++}});toast(`${added} wedstrijden toegevoegd, ${overwrites} overschreven`)}else if(type==='licenties'){const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();const byName={};app.data.spelers.forEach(p=>{byName[norm(fullName(p))]=p;const vn=norm((p.voornaam||'')+' '+(p.achternaam||''));if(vn)byName[vn]=byName[vn]||p});let matched=0,unmatched=0;const seen=new Set();rows.forEach(r=>{const nm=norm(r[mapping.name]);if(!nm)return;const lvl=mapLicense(r[mapping.license]);const p=byName[nm];if(p){if(!seen.has(p.id)){p.license=lvl;seen.add(p.id);matched++}else if(licRank(lvl)>licRank(p.license)){p.license=lvl}}else unmatched++});toast(`${matched} licenties gekoppeld${unmatched?(', '+unmatched+' niet gevonden'):''}`)}else{app.data.spelers=rows.map(r=>{const lic=mapLicense(r[mapping.license]);const vn=String(r[mapping.voornaam]||'').trim();const tv=String(r[mapping.tussenvoegsel]||'').trim();const an=String(r[mapping.achternaam]||'').trim();let voornaam,tussenvoegsel,achternaam;if(vn||tv||an){voornaam=vn;tussenvoegsel=tv;achternaam=an}else{const nm=splitName(r[mapping.name]);voornaam=nm.voornaam;tussenvoegsel=nm.tussenvoegsel;achternaam=nm.achternaam}const o={id:uid(),voornaam,tussenvoegsel,achternaam,team:String(r[mapping.team]||'').trim(),role:String(r[mapping.role]||'beide').trim(),license:lic,status:'available',reason:''};o.name=fullName(o);return o}).filter(p=>p.voornaam||p.achternaam);toast(`${app.data.spelers.length} spelers geïmporteerd`)}updateCounts();saveAll()}
function exportPdf(matchId){const id=typeof matchId==='string'?matchId:app.selectedMatchId;const match=app.data.wedstrijden.find(w=>w.id===id);if(!match)return;const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(255,107,0);doc.rect(0,0,210,20,'F');doc.setTextColor(255,255,255);doc.setFontSize(18);doc.text(app.data.instellingen.vereniging,14,13);doc.setTextColor(0,0,0);doc.setFontSize(12);let y=30;doc.text(`${match.homeTeam} vs. ${match.awayTeam}`,14,y);y+=8;doc.text(`${fmtDate(match.date)} ${match.time}`,14,y);y+=10;rolesFor(match).forEach(r=>{doc.text(`${r.label}: ${assignmentFor(match.id)[r.key]?playerName(assignmentFor(match.id)[r.key]):'-'}`,14,y);y+=8});doc.save(`indeling-${match.homeTeam}.pdf`);toast('PDF geëxporteerd')}
function exportTeamPdf(team){if(!team)return toast('Kies eerst een team');const teamPlayerIds=new Set(app.data.spelers.filter(p=>p.team===team).map(p=>p.id));const matches=app.data.wedstrijden.slice().sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));const tasks=[];matches.forEach(m=>{const asg=assignmentFor(m.id);rolesFor(m).forEach(r=>{const pid=asg[r.key];if(pid&&teamPlayerIds.has(pid))tasks.push({m,role:r,pid})})});if(!tasks.length)return toast('Geen taken gevonden voor spelers van dit team');const nRef=tasks.filter(t=>t.role.type==='scheidsrechter').length;const nJury=tasks.filter(t=>t.role.type==='jury').length;const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(255,107,0);doc.rect(0,0,210,20,'F');doc.setTextColor(255,255,255);doc.setFontSize(15);doc.text(`${app.data.instellingen.vereniging} — taken ${team}`,14,13);doc.setTextColor(0,0,0);let y=30;doc.setFontSize(11);doc.text(`Seizoen ${app.data.instellingen.seizoen||''}`,14,y);y+=7;doc.text(`Totaal ${tasks.length} taak/taken  ·  ${nRef} scheidsrechter, ${nJury} jury`,14,y);y+=10;doc.setFontSize(10);let lastDay='';tasks.forEach(t=>{if(y>285){doc.addPage();y=20}if(t.m.date!==lastDay){lastDay=t.m.date;doc.setFont(undefined,'bold');if(y>278){doc.addPage();y=20}doc.text(fmtDate(t.m.date),14,y);y+=6;doc.setFont(undefined,'normal')}doc.text(`     ${t.m.time}  ·  ${t.role.label}  ·  ${playerName(t.pid)}  —  ${t.m.homeTeam} vs. ${t.m.awayTeam}`,14,y);y+=6});doc.save(`taken-${team}.pdf`);toast(`PDF met taken voor ${team} geëxporteerd`)}
function icsStamp(dateStr,hh,mm){return dateStr.replace(/-/g,'')+'T'+String(hh).padStart(2,'0')+String(mm).padStart(2,'0')+'00'}
function exportICS(){const matches=app.data.wedstrijden.slice().sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));if(!matches.length)return toast('Geen wedstrijden om te exporteren');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Basketbal Indeling App//NL','CALSCALE:GREGORIAN'];matches.forEach(m=>{const [h,mi]=(m.time||'00:00').split(':').map(Number);const start=icsStamp(m.date,h||0,mi||0);const end=icsStamp(m.date,(h||0)+2,mi||0);const tasks=rolesFor(m).map(r=>{const pid=assignmentFor(m.id)[r.key];return r.label+': '+(pid?playerName(pid):'-')}).join('\\n');lines.push('BEGIN:VEVENT','UID:'+m.id+'@bball-indeling','DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+m.homeTeam+' vs '+m.awayTeam,'DESCRIPTION:'+tasks,'END:VEVENT')});lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='basketbal-indeling.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('iCal-bestand geëxporteerd')}
function exportHistory(){const rows=app.data.spelers.map(p=>{const c=app.data.tellingen[p.id]||{scheidsrechter:0,jury:0};return{Voornaam:p.voornaam||'',Tussenvoegsel:p.tussenvoegsel||'',Achternaam:p.achternaam||'',Speler:fullName(p),Team:p.team,Licentie:p.license||'',Scheidsrechter:c.scheidsrechter,Jury:c.jury,Totaal:c.scheidsrechter+c.jury}});const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Geschiedenis');XLSX.writeFile(wb,'seizoensgeschiedenis.xlsx');toast('Geschiedenis geëxporteerd')}
function archiveSeason(){const s=app.data.instellingen.seizoen||'Onbekend seizoen';if(!confirm(`Huidige tellingen archiveren als ${s}?`))return;app.data.archief[s]=JSON.parse(JSON.stringify(app.data.tellingen));app.data.tellingen={};saveAll();render();toast('Nieuw seizoen gestart')}
updateCounts();render();
</script>
